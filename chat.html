<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat - ForeignersLove</title>
<style>
body{margin:0;font-family:Arial;background:#f0f2f5}
.header{background:#075e54;color:white;padding:12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
.header img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.online{font-size:11px;color:#25d366}
.chat-box{padding:15px;padding-bottom:80px;max-width:600px;margin:auto;min-height:60vh}
.msg{max-width:75%;padding:10px 14px;border-radius:18px;margin:8px 0;word-wrap:break-word;line-height:1.4}
.me{background:#dcf8c6;margin-left:auto;border-bottom-right-radius:4px}
.her{background:white;margin-right:auto;border-bottom-left-radius:4px;box-shadow:0 1px 1px #0001}
.input-area{position:fixed;bottom:0;left:0;right:0;background:white;padding:8px;display:flex;gap:8px;max-width:600px;margin:auto;border-top:1px solid #ddd}
.input-area input{flex:1;padding:12px;border-radius:20px;border:1px solid #ddd;outline:none}
.input-area button{background:#075e54;color:white;border:none;width:45px;height:45px;border-radius:50%;cursor:pointer;font-size:18px}
.payWall{max-width:400px;margin:30px auto;background:white;padding:20px;border-radius:15px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
.payBox{background:#fff8e1;border:2px dashed #ff9800;padding:15px;border-radius:10px;margin:15px 0}
.num{font-size:26px;font-weight:bold;color:#0a8a00}
</style>
</head>
<body>
<div class="header"><img id="hImg" src=""><div><div id="hName" style="font-weight:bold">Loading...</div><div class="online">● Online now</div></div></div>
<div id="payWall" class="payWall">
<h3 id="lockTitle">🔒 Unlock Chat</h3>
<p id="lockText">Pay 150 KSH to start chatting and keep chats forever!</p>
<div class="payBox"><p>Send Money Via M-Pesa</p><p class="num">0706900843</p><p>Amount: <b>150 KSH</b><br>Name: OLOO</p></div>
<input id="mpesaCode" placeholder="Enter M-Pesa Code from SMS" style="width:90%;padding:12px;border-radius:8px;border:1px solid #ddd">
<button onclick="unlock()" style="width:95%;padding:12px;background:#00a651;color:white;border:none;border-radius:8px;margin-top:10px;font-weight:bold;font-size:16px;cursor:pointer">Verify & Unlock Chat</button>
<p id="payMsg"></p>
<p style="font-size:11px;color:#888">Your chats will be saved permanently even after you log out</p>
</div>
<div id="chatBox" class="chat-box" style="display:none"></div>
<div id="inputArea" class="input-area" style="display:none"><input id="msgInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')send()"><button onclick="send()">➤</button></div>
<script>
const persons={aisha:{name:"Aisha, 22",img:"https://randomuser.me/api/portraits/women/1.jpg"},sasha:{name:"Sasha, 24",img:"https://randomuser.me/api/portraits/women/2.jpg"},keisha:{name:"Keisha, 23",img:"https://randomuser.me/api/portraits/women/3.jpg"},muthoni:{name:"Muthoni, 21",img:"https://randomuser.me/api/portraits/women/4.jpg"},zara:{name:"Zara, 25",img:"https://randomuser.me/api/portraits/women/5.jpg"},njeri:{name:"Njeri, 22",img:"https://randomuser.me/api/portraits/women/6.jpg"},wanjiku:{name:"Wanjiku, 24",img:"https://randomuser.me/api/portraits/women/7.jpg"},akinyi:{name:"Akinyi, 23",img:"https://randomuser.me/api/portraits/women/8.jpg"},amina:{name:"Amina, 21",img:"https://randomuser.me/api/portraits/women/9.jpg"},chebet:{name:"Chebet, 26",img:"https://randomuser.me/api/portraits/women/10.jpg"},atieno:{name:"Atieno, 22",img:"https://randomuser.me/api/portraits/women/11.jpg"},kamene:{name:"Kamene, 24",img:"https://randomuser.me/api/portraits/women/12.jpg"},syombua:{name:"Syombua, 23",img:"https://randomuser.me/api/portraits/women/13.jpg"},mwende:{name:"Mwende, 25",img:"https://randomuser.me/api/portraits/women/14.jpg"},nduta:{name:"Nduta, 22",img:"https://randomuser.me/api/portraits/women/15.jpg"},kawira:{name:"Kawira, 24",img:"https://randomuser.me/api/portraits/women/16.jpg"},naserian:{name:"Naserian, 21",img:"https://randomuser.me/api/portraits/women/17.jpg"},awuor:{name:"Awuor, 23",img:"https://randomuser.me/api/portraits/women/18.jpg"},mukami:{name:"Mukami, 26",img:"https://randomuser.me/api/portraits/women/19.jpg"},wafula:{name:"Wafula, 22",img:"https://randomuser.me/api/portraits/women/20.jpg"}};
const params=new URLSearchParams(window.location.search);const id=params.get('id')||'aisha';const person=persons[id]||persons['aisha'];
document.getElementById('hName').innerText=person.name;document.getElementById('hImg').src=person.img;
document.getElementById('lockTitle').innerText="🔒 Unlock Chat with "+person.name.split(',')[0];
document.getElementById('lockText').innerText="Pay 150 KSH to chat with "+person.name.split(',')[0]+" forever! Chats saved permanently.";
let currentUser=localStorage.getItem('currentUserEmail')||'guest_'+Date.now();if(!localStorage.getItem('currentUserEmail')){localStorage.setItem('guestId',Date.now());localStorage.setItem('currentUserEmail',currentUser);}
function checkPaid(){return localStorage.getItem('paid_'+currentUser+'_'+id)==='true';}
function showChat(){document.getElementById('payWall').style.display='none';document.getElementById('chatBox').style.display='block';document.getElementById('inputArea').style.display='flex';loadChats();}
if(checkPaid()){showChat();}
function unlock(){let code=document.getElementById('mpesaCode').value.trim().toUpperCase();if(code.length<8){document.getElementById('payMsg').innerHTML="<span style='color:red'>Enter valid M-Pesa code</span>";return;}let used=JSON.parse(localStorage.getItem('usedCodes')||'[]');if(used.includes(code)){document.getElementById('payMsg').innerHTML="<span style='color:red'>Code already used!</span>";return;}used.push(code);localStorage.setItem('usedCodes',JSON.stringify(used));localStorage.setItem('paid_'+currentUser+'_'+id,'true');document.getElementById('payMsg').innerHTML="<span style='color:green'>Success! Chat unlocked!</span>";setTimeout(showChat,800);}
function loadChats(){let key='chats_'+currentUser+'_'+id;let chats=JSON.parse(localStorage.getItem(key)||'[]');let box=document.getElementById('chatBox');box.innerHTML='';if(chats.length===0){let first="Hi 😊 I'm "+person.name.split(',')[0]+", nice to meet you! How are you today?";addMsg('her',first);saveRaw('her',first);}else{chats.forEach(c=>addMsg(c.sender,c.text));}}
function addMsg(sender,text){let box=document.getElementById('chatBox');let div=document.createElement('div');div.className='msg '+(sender==='me'?'me':'her');div.innerText=text;box.appendChild(div);box.scrollTop=box.scrollHeight;window.scrollTo(0,document.body.scrollHeight);}
function saveRaw(sender,text){let key='chats_'+currentUser+'_'+id;let chats=JSON.parse(localStorage.getItem(key)||'[]');chats.push({sender,text,time:Date.now()});localStorage.setItem(key,JSON.stringify(chats));}
function send(){let input=document.getElementById('msgInput');let text=input.value.trim();if(!text)return;addMsg('me',text);saveRaw('me',text);input.value='';setTimeout(()=>{let replies=["Aww that's sweet 🥰","I like that! Tell me more","Haha you are funny 😄","I was waiting for your message","You make me smile","We should meet someday?","What do you like doing?","I'm shy but I like you"];let r=replies[Math.floor(Math.random()*replies.length)];addMsg('her',r);saveRaw('her',r);},1200);}
</script>
</body>
</html>
