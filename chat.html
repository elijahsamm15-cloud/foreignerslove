<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat - ForeignersLove</title>
<style>
body{margin:0;font-family:Arial;background:#ffe6f0;display:flex;flex-direction:column;height:100vh}
.header{background:#ff4081;color:white;padding:12px;text-align:center;font-weight:bold}
#chatBox{flex:1;overflow-y:auto;padding:15px;background:#fff0f5}
.msg{margin:8px 0;padding:10px 14px;border-radius:15px;max-width:75%;word-wrap:break-word}
.me{background:#ff4081;color:white;margin-left:auto}
.them{background:white;border:1px solid #ddd}
.inputArea{display:flex;padding:10px;background:white;border-top:1px solid #ddd}
.inputArea input{flex:1;padding:12px;border:1px solid #ddd;border-radius:20px}
.inputArea button{margin-left:8px;padding:12px 18px;background:#ff4081;color:white;border:none;border-radius:20px;font-weight:bold}
</style>
</head>
<body>
<div class="header">💖 <span id="friendName">Yuki - Japan</span> <span style="float:right"><a href="index.html" style="color:white;text-decoration:none">Home</a></span></div>
<div id="chatBox">
<div class="msg them">Hi! I'm Yuki from Japan 🇯🇵 How are you? Thanks for activating VIP! 💖</div>
</div>
<div class="inputArea">
<input id="msgInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">Send</button>
</div>
<script>
// Check VIP
let vip = localStorage.getItem('fl_vip');
let name = localStorage.getItem('fl_name') || 'Friend';
if(vip !== 'true'){
  alert('Please activate VIP first - 150 KSH');
  window.location.href='register.html';
}

// Get selected friend from URL
let params = new URLSearchParams(window.location.search);
let friend = params.get('friend') || 'Yuki';
let country = params.get('country') || 'Japan';
document.getElementById('friendName').innerText = friend + ' - ' + country;

const replies = [
  "That's so sweet! Tell me more 😊",
  "Haha I love talking with you from Kenya!",
  "Wow, you are very kind 💖",
  "I was waiting for you to message me!",
  "Do you want to be my special friend?",
  "Your messages make me smile!",
  "I like your energy 😍",
  "Tell me about your day!"
];

function send(){
  let input = document.getElementById('msgInput');
  let text = input.value.trim();
  if(!text) return;
  let box = document.getElementById('chatBox');
  box.innerHTML += `<div class="msg me">${text}</div>`;
  input.value='';
  box.scrollTop = box.scrollHeight;
  setTimeout(()=>{
    let r = replies[Math.floor(Math.random()*replies.length)];
    box.innerHTML += `<div class="msg them">${r}</div>`;
    box.scrollTop = box.scrollHeight;
  }, 800);
}
</script>
</body>
</html>
